/* Transformer: contextual representations across layers. */
.tf-intro{padding:22px 24px 0}.tf-kicker{font-size:10px;letter-spacing:.16em;color:var(--muted)}.tf-intro p{font-size:23px;letter-spacing:.015em;line-height:1.5;margin:9px 0 19px;font-weight:600}.tf-controls{padding:0 24px 20px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}.tf-steps,.tf-playback{display:flex;gap:5px}.tf-controls button{border:1px solid #b8c6af;background:white;color:var(--green);padding:7px 11px;border-radius:5px;font-size:12px}.tf-steps button[aria-pressed=true],.tf-play[aria-pressed=true]{background:var(--green);color:white}.tf-controls button:disabled{opacity:.35;cursor:default}.tf-stage{display:grid;grid-template-columns:minmax(0,1fr) 200px;align-items:center;padding:10px 20px 18px 4px;gap:6px}.tf-space svg{min-width:0;width:100%}.tf-token{transition:transform 1000ms cubic-bezier(.4,0,.2,1)}.tf-counter{font-size:10px;color:var(--green);letter-spacing:.13em;margin:0}.tf-stage-copy h3{font-size:18px;margin:8px 0 10px}.tf-stage-copy p.tf-stage-description{font-size:13px;line-height:1.9;min-height:125px;margin:0}.tf-cycle{margin-top:18px;padding:14px 12px;border-left:2px solid #b9cbae;background:#f5f7ef;font-size:12px;line-height:1.7;color:#4b674a}.tf-cycle span{color:#6f8762}.tf-static{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding:24px}.tf-static>div{min-width:0}.tf-static svg{min-width:0}.tf-static p{font-size:12px;line-height:1.8}.tf-enhanced .tf-static{display:none}
@container(max-width:600px){.tf-stage{grid-template-columns:1fr;padding:5px 15px 20px}.tf-stage-copy{border-top:1px solid var(--line);padding:16px 6px 0}.tf-stage-copy p.tf-stage-description{min-height:0}.tf-cycle{display:none}.tf-intro{padding:18px 18px 0}.tf-intro p{font-size:20px}.tf-controls{padding:0 18px 17px}.tf-controls button{padding:8px 10px}.tf-static{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.tf-token{transition:none}}
@media print{.tf-live{display:none!important}.tf-enhanced .tf-static{display:grid}.tf-static{grid-template-columns:1fr 1fr}.tf-representation{break-inside:auto}.tf-static>div{break-inside:avoid}}


.tf-steps{flex-wrap:wrap}.tf-sentence .tf-space ellipse,.tf-sentence .tf-token circle,.tf-sentence .tf-space svg>text{opacity:0}.tf-sentence .tf-token text{fill:#294337;stroke:none}.tf-space ellipse,.tf-token circle{transition:opacity .5s}

.tf-halo{display:none}.tf-final-layer .tf-token.tf-last .tf-halo{display:block}.tf-final-layer .tf-token:not(.tf-last){opacity:.4}.tf-token{transition:transform 1000ms cubic-bezier(.4,0,.2,1),opacity .5s}.tf-ellipsis{align-self:center;padding:0 3px}.tf-output svg{width:100%;min-width:0}.tf-space[hidden],.tf-output[hidden]{display:none!important}

/* Keep teaching diagrams at a readable scale even on very wide screens. */
.figure-scroll>svg{display:block;width:100%;max-width:760px;max-height:560px;min-width:0;margin:auto}
#attention .figure-scroll>svg{max-width:540px;max-height:390px}
.tf-stage{grid-template-columns:minmax(0,520px) 200px;justify-content:center}.tf-representation .tf-live{max-width:790px;margin:auto}
.tf-vector-shape{transition:x .7s,y .7s,width .7s,height .7s,rx .7s,fill-opacity .5s,opacity .5s}
.tf-numbers,.tf-output-chain{opacity:0;transition:opacity .4s}.tf-word{transition:opacity .4s}
.tf-sentence .tf-vector-shape{opacity:0}
.tf-numeric .tf-word{opacity:0}.tf-numeric .tf-column{opacity:1}.tf-numeric .tf-vector-shape{opacity:0}
.tf-numeric .tf-space ellipse,.tf-numeric .tf-space svg>text{opacity:0}
.tf-output-moving .tf-token:not(.tf-last),.tf-output-moving .tf-space ellipse,.tf-output-moving .tf-space svg>text{opacity:0}
.tf-output-morph .tf-token.tf-last .tf-vector-shape{x:-85px;y:-23px;width:170px;height:46px;rx:4px;fill-opacity:.15;stroke:#b2703c}
.tf-output-morph .tf-token.tf-last .tf-numbers{opacity:1}
.tf-output-morph .tf-token.tf-last .tf-word{transform:translate(-35px,-40px)}
.tf-output-ready .tf-output-chain{opacity:1}
@container(max-width:600px){.tf-stage{grid-template-columns:1fr}.tf-stage-copy{padding-top:10px}}
@media(prefers-reduced-motion:reduce){.tf-token,.tf-vector-shape,.tf-numbers,.tf-word,.tf-output-chain{transition:none}}

.tf-numeric .tf-token{transition:transform .35s ease}.tf-numeric .tf-column{transition:opacity .35s .25s}
@media(prefers-reduced-motion:reduce){.tf-numeric .tf-token,.tf-numeric .tf-numbers{transition:none}}

.tf-column{opacity:0;transition:opacity .35s}.tf-sentence .tf-column text{fill:inherit}
@media(prefers-reduced-motion:reduce){.tf-column{transition:none}}

.tf-cycle{text-align:center}.tf-cycle>span{display:block;line-height:1;padding:8px 0;font-size:18px}.tf-cycle>div{color:#4b674a}
