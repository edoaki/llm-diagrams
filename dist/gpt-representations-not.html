@media(min-width:1600px){.layout{gap:52px}}@media(max-width:1200px){.layout{grid-template-columns:210px minmax(0,1fr);gap:35px}.toc{display:none}}@media(max-width:820px){.topbar{padding:0 18px}.brand span{display:none}.layout{display:block;padding:0 24px}.sidenav{display:none;position:fixed;top:64px;left:0;width:285px;z-index:4;background:var(--paper);padding:24px;border-right:1px solid var(--line);box-shadow:20px 0 30px #20372f22}.sidenav.open{display:block}.mobile-menu{display:inline-block}.article{padding-top:35px}.hero{margin-bottom:32px}.lead{font-size:15px}.article section{margin:40px 0}h2{font-size:23px}.cards{gap:12px}.card{padding:19px}}@media(max-width:520px){.layout{padding:0 19px}.cards,.compare,.scene-grid{grid-template-columns:1fr}.card h3{font-size:18px}h1{font-size:31px}p,li{font-size:15px;line-height:1.95}.note{padding:16px 18px}.equation{font-size:17px;padding:18px}.demo{padding:16px}figcaption{padding:12px 15px}.stat-row{gap:22px}.scene-grid svg{min-width:0}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}@media print{.topbar,.sidenav,.toc,.pager,.demo button,.footer{display:none}.layout{display:block;padding:0}.article{max-width:none;padding:0}body{font-size:11pt;background:white}.hero{padding-bottom:10px}figure,table,.note{break-inside:avoid}figure svg{min-width:0}.article section{margin:24px 0}.cards{grid-template-columns:1fr 1fr}a{color:inherit}.equation{white-space:normal}}

/* Keep TeX metrics intact; long equations scroll within their own panel. */
.equation .katex-display{margin:0;text-align:left}
.equation .katex-display>.katex{text-align:left}
.equation .katex{font-size:1.15em}
@media print{.equation{overflow:visible;break-inside:avoid}}
/* Dark theme. navigation.js sets data-theme before paint from an explicit saved choice, defaulting to light.
   Figures and demos stay light "islands" because their hand-drawn SVGs assume a light ground. */
:root[data-theme=dark]{--ink:#e2e8e1;--muted:#a7b5a9;--green:#8fc6a2;--paper:#131916;--line:#2e3a32;--tint:#1d2821;--blue:#91b8d6;--accent:#e2a57c;--surface:#1a211d;--highlight:#6d5c1d;--panel:#1a211d;--note:#1c271f;--th:#1f2a22;--th-ink:#c5d9c3;color-scheme:dark}
[data-theme=dark] a:hover{color:#b6dcc2}
[data-theme=dark] :focus-visible{outline-color:#5f9c74}
[data-theme=dark] .skip{background:var(--surface)}
[data-theme=dark] .topbar{background:#131916f2}
[data-theme=dark] .sidenav a[aria-current=page]{background:#223326;color:#cfe8d6}
[data-theme=dark] .sidenav summary{color:#b3c7b2}
[data-theme=dark] .lead{color:#bccabd}
[data-theme=dark] .note{border-left-color:#6f8c5f}
[data-theme=dark] .note>strong{color:#b9d6a9}
[data-theme=dark] .card{background:var(--surface);color:var(--ink)}
[data-theme=dark] .card:hover{background:#202b24;border-color:#4a5d4c}
[data-theme=dark] .paper-label{background:#3a2c1d;color:#ecc79f}
[data-theme=dark] .sidenav .nav-category,[data-theme=dark] .sidenav small,[data-theme=dark] .sidenav a[data-parent]::before{color:var(--muted)}
[data-theme=dark] .publication-status{background:#1c241f;border-left-color:#6f8069}
[data-theme=dark] .legacy-links{border-color:var(--line)}
[data-theme=dark] .sidenav{scrollbar-color:#3a473e transparent}
/* Page containers drawn with their own light background (listed here so the palette lives in one place). */
[data-theme=dark] :is(figure,.demo,.light-island,.gnn-working,.gnn-replay,.ssm-detail,.audio-sample,.science-io>div:not(.science-arrow),.science-condition,.tf-cycle,.gnn-pipeline>div){--ink:#243b30;--muted:#5d6d60;--green:#35664d;--paper:#ffffff;--line:#e3e7e5;--tint:#f6f8f7;--blue:#4d7897;--accent:#ba7147;--surface:#fff;--panel:#f8f9f8;--note:#f6f8f7;--th:#f5f7f6;--th-ink:#456044;color:var(--ink);color-scheme:light}
[data-theme=dark] figure a:hover,[data-theme=dark] .demo a:hover{color:#183f2b}
.theme-toggle{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0;border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--muted)}
.theme-toggle:hover{color:var(--green);border-color:var(--green)}
.theme-toggle[hidden]{display:none}
.top-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
@media print{.top-actions{display:none}}
:where([data-theme=dark]) :where(.light-island){background-color:#fcfcf8}

/* Shared editorial structure; page-specific visuals retain their existing styling. */
.article section { scroll-margin-top: 5rem; }
.article > h2[id] { margin: 3.25rem 0 1.5rem; scroll-margin-top: 5rem; }
.sidenav .nav-category { margin: 1rem .6rem .25rem; color: var(--nav-category); font-size: .75rem; }
.sidenav a[data-parent] { padding-left: 2.5rem; }
.sidenav small { display: inline; margin-left: .35rem; font-size: .67rem; color: #6a716b; }
.publication-status { padding: .8rem 1rem; border-left: 3px solid #9ca98d; background: var(--tint); font-size: .9rem; }
.publication-status p { margin: .4rem 0; }
.legacy-links { margin-top: 2rem; padding: .6rem 1rem; border: 1px solid var(--line); border-radius: .4rem; }
.article .cards { display: block; }
.article .cards p { margin: .7rem 0; }
figure > p > a > img, figure > p > img { max-width: 100%; height: auto; }
.article table { min-width: 0; }
@media (max-width: 820px) { .publication-status { font-size: .85rem; } }
.article section[id$="sources"] ul { font-size: 13px; }

.sidenav a[data-parent]::before { content: "↳ "; color: var(--nav-child); }

/* Colour roles for figures (docs/policy/03-figures.md#色の役割): input data, output (prediction),
   learned parameters, answer and loss, and everything else. Always pair colour with a direct label.
   Figures stay light in the dark theme, so they keep the light values; prose outside them gets lighter inks. */
:root,[data-theme=dark] :is(figure,.demo,.light-island){--role-input:#255f9e;--role-input-tint:#eef2f7;--role-input-line:#9db7d3;--role-output:#2c7a4f;--role-output-tint:#eef4f1;--role-output-line:#a0c3b0;--role-param:#a8407f;--role-param-tint:#f8f0f5;--role-param-line:#d8a9c5;--role-loss:#a9540f;--role-loss-tint:#f8f1ec;--role-loss-line:#d8b293;--role-neutral:#5d6d60;--role-neutral-tint:#f2f3f2;--role-neutral-line:#b6bdb7}
:root[data-theme=dark]{--role-input:#8db8e8;--role-input-tint:#273238;--role-input-line:#50697f;--role-output:#86c9a0;--role-output-tint:#25352c;--role-output-line:#4d715b;--role-param:#e59ac6;--role-param-tint:#352e32;--role-param-line:#7c5a6e;--role-loss:#eaa46a;--role-loss-tint:#352f23;--role-loss-line:#7f5f40;--role-neutral:#a7b5a9;--role-neutral-tint:#2b322e;--role-neutral-line:#5d6760}
/* Pick a role, then say how to paint it: .r-box (tinted shape), .r-line (stroke only), .r-mark (solid), .r-text, .r-chip. */
.r-input{--r:var(--role-input);--r-tint:var(--role-input-tint);--r-line:var(--role-input-line)}
.r-output{--r:var(--role-output);--r-tint:var(--role-output-tint);--r-line:var(--role-output-line)}
.r-param{--r:var(--role-param);--r-tint:var(--role-param-tint);--r-line:var(--role-param-line)}
.r-loss{--r:var(--role-loss);--r-tint:var(--role-loss-tint);--r-line:var(--role-loss-line)}
.r-neutral{--r:var(--role-neutral);--r-tint:var(--role-neutral-tint);--r-line:var(--role-neutral-line)}
svg .r-box{fill:var(--r-tint);stroke:var(--r)}
svg .r-line{fill:none;stroke:var(--r)}
svg .r-mark{fill:var(--r)}
.r-text{color:var(--r);fill:var(--r)}
.r-chip{display:inline-block;padding:0 .5em;border:1px solid var(--r-line);border-radius:4px;background:var(--r-tint);color:var(--r);font-weight:650;line-height:1.7;white-space:nowrap}

/* Illustrated paper explanation (docs/policy/02-papers-and-sources.md#図付き解説の型). */
.article .paper-explainer{margin:40px 0;padding:6px 24px 10px;border:1px solid var(--line);border-top:3px solid var(--green);border-radius:8px;background:var(--surface)}
.paper-explainer::before{content:"論文解説";display:block;margin-top:14px;color:var(--green);font-size:11px;font-weight:700;letter-spacing:.14em}
.article .paper-explainer>h3{margin:4px 0 2px;scroll-margin-top:92px}
.paper-explainer>.paper-meta{margin:0 0 18px;color:var(--muted);font-size:13px;line-height:1.8}
.paper-explainer>h4{margin:26px 0 4px;color:var(--th-ink);font-size:13px;font-weight:700;letter-spacing:.04em}
.paper-explainer>h4+p{margin-top:4px}
.paper-explainer figure{margin:18px 0}
/* Input → output pair: each side takes its colour role; a leading bold word becomes the side's label. */
.io-pair{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:stretch;margin:16px 0}
.io-pair::before{content:"→";grid-column:2;grid-row:1;align-self:center;color:var(--muted);font-size:20px}
.io-pair>.io-in,.io-pair>.io-out{min-width:0;padding:10px 16px;border:1px solid var(--r-line);border-radius:8px;background:var(--r-tint)}
.io-pair>.io-in{--r:var(--role-input);--r-tint:var(--role-input-tint);--r-line:var(--role-input-line);grid-column:1;grid-row:1}
.io-pair>.io-out{--r:var(--role-output);--r-tint:var(--role-output-tint);--r-line:var(--role-output-line);grid-column:3;grid-row:1}
.io-pair p{margin:6px 0;font-size:14px;line-height:1.8}
.io-pair>div>p:first-child>strong:first-child{display:block;color:var(--r);font-size:12px;letter-spacing:.06em}
.io-pair img{display:block;max-width:100%;height:auto;margin:6px auto;border-radius:4px}
@media(max-width:520px){.article .paper-explainer{padding:4px 16px 8px}.io-pair{grid-template-columns:minmax(0,1fr)}.io-pair::before{content:"↓";grid-column:1;grid-row:2;justify-self:center}.io-pair>.io-in{grid-column:1;grid-row:1}.io-pair>.io-out{grid-column:1;grid-row:3}}

/* Toggles in the body: optional depth that the main line never depends on (docs/policy/01-overall.md#トグル折りたたみ). */
main.article details{margin:24px 0;padding:0 20px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
main.article details>summary{display:flex;align-items:center;gap:12px;min-height:48px;margin:0 -20px;padding:10px 20px;border-radius:7px;list-style:none;color:var(--ink);font-size:15px;font-weight:650;line-height:1.6;cursor:pointer}
main.article details>summary::-webkit-details-marker{display:none}
main.article details>summary::before{content:"";flex:none;width:7px;height:7px;margin:0 3px 0 1px;border-right:2px solid var(--green);border-bottom:2px solid var(--green);transform:rotate(-45deg);transition:transform .15s}
main.article details>summary:hover{background:var(--tint)}
main.article details[open]{padding-bottom:6px}
main.article details[open]>summary{margin-bottom:8px;border-bottom:1px solid var(--line);border-radius:7px 7px 0 0}
main.article details[open]>summary::before{transform:rotate(45deg)}
main.article details details{background:var(--tint)}
@media(max-width:520px){main.article details{padding:0 14px}main.article details>summary{margin:0 -14px;padding:10px 14px;font-size:14px}}
@media(prefers-reduced-motion:reduce){main.article details>summary::before{transition:none}}
@media print{main.article details>summary::before{display:none}}

/* New introductory pages: readable text, progressive-enhancement diagrams. */
.article > h2 { margin-top: 3.2rem; scroll-margin-top: 6rem; }
.learning-demo { background: #fff; border: 1px solid #d5dfd5; border-radius: 10px; }
.ld-body { padding: 24px; }
.ld-eyebrow { color: #516d59; font-size: 12px; letter-spacing: .08em; margin: 0 0 12px; }
.ld-title { display: block; margin-bottom: 16px; font-size: 18px; }
.ld-controls { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0 8px; align-items: center; }
.learning-demo [hidden] { display: none !important; }
.ld-controls button, .ld-controls select { border: 1px solid #8ba58e; border-radius: 6px; background: #f8faf5; color: #243b30; padding: 10px 14px; min-height: 44px; max-width: 100%; }
.ld-controls button:hover { background: #e9f0e4; }
.ld-controls button:disabled { opacity: .5; cursor: default; }
.ld-controls button[aria-pressed="true"] { background: #35664d; color: white; }
.ld-controls label { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.ld-status { background: #f0f5ec; padding: 14px 16px; border-radius: 6px; font-size: 14px; min-height: 4em; overflow-wrap: anywhere; }
.ld-bars { display: grid; gap: 16px; }
.ld-bar-label { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; font-size: 14px; }
.ld-track { height: 20px; background: #e9eeea; border-radius: 4px; overflow: hidden; }
.ld-fill { display: block; height: 100%; background: #467557; transition: width .4s ease; }
.ld-fill.alt { background: #537f9b; }
.ld-sequence { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 0; }
.ld-token { background: #ecf2e7; border: 1px solid #a9bea5; border-radius: 5px; padding: 8px 12px; }
.ld-token:last-child { background: #35664d; color: white; }
.ld-candidate { padding: 12px; border-left: 3px solid #7595ad; background: #f2f6fa; }
.ld-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.ld-card { padding: 14px 10px; border: 1px solid #d5dfd5; border-radius: 6px; background: #fafbf7; text-align: center; }
.ld-card strong, .ld-card span { display: block; }
.ld-card span { font-size: 13px; margin-top: 8px; }

    later(()=>d.classList.remove('tf-space-moving'),MOVE+100);
   },DOT_HOLD);
  },800);
 }
 function show(stage){
  clearMerge?.();clearMerge=null;timers.forEach(clearTimeout);timers=[];
  const previous=current;current=stage;
  frame(stage===outputStage?280+c().candidates.length*36:430);
  d.classList.remove('tf-numeric','tf-output-morph','tf-output-ready','tf-output-moving','tf-pe-visible','tf-pe-merge','tf-position-added','tf-dot-forming','tf-dot-hold','tf-space-moving','tf-output-linear','tf-output-scores','tf-output-softmax','tf-leaving-space');
  scaleOutput(false);
  d.classList.toggle('tf-sentence',stage===0);d.classList.toggle('tf-final-layer',stage===finalStage);
  qa('[data-layer]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.layer===stage)));
  q('.tf-space svg').setAttribute('aria-label',`${c().prompt}：${stages[stage]}`);
  q('.tf-space-title').textContent=stage===1?'初期埋め込みの空間':stage>=2&&stage<=finalStage?`${layerLabel(layerAt(stage))}層の空間`:'';
  q('.tf-vector-label').textContent=(additive?'埋め込み':data.model.positionEncoding.label+'（埋め込みへの加算は表示しません）');
  if(stage===1&&!reduced.matches){
   // Coming back from the space, return the dots to their columns before showing numbers.
   const lead=previous>=2?MOVE:0,step=(fn,ms)=>later(fn,lead+ms);
   if(lead)d.classList.add('tf-leaving-space');
   placeVectors();values(false);
   step(()=>d.classList.add('tf-numeric'),0);
   if(!additive){step(formDots,1700);return;}
   step(()=>{d.classList.add('tf-pe-visible');q('.tf-vector-label').textContent='＋ '+data.model.positionEncoding.label;},1700);
   step(()=>{
    const moving=q('.tf-pe');
    const merged=event=>{if(event.target!==moving||event.propertyName!=='transform')return;clearMerge?.();clearMerge=null;values(true);d.classList.add('tf-position-added');q('.tf-vector-label').textContent='埋め込み ＋ 位置エンコーディング';later(formDots,BEAT);};
    moving.addEventListener('transitionend',merged);clearMerge=()=>moving.removeEventListener('transitionend',merged);d.classList.add('tf-pe-merge');
   },1700+BEAT+600);
  }else if(stage===outputStage){
   values(true,finalStage);if(previous!==finalStage)place(finalStage);d.classList.add('tf-output-moving');
   const morph=()=>{d.classList.add('tf-output-morph');q('.tf-last').style.transform='translate(260px,65px)';};
   if(reduced.matches){morph();d.classList.add('tf-output-linear','tf-output-scores','tf-output-softmax','tf-output-ready');scaleOutput(true);}
   else {
    const delay=previous===finalStage?60:MOVE,arrive=delay+MOVE;
    later(morph,delay);
    later(()=>d.classList.add('tf-output-linear'),arrive);
    later(()=>d.classList.add('tf-output-scores'),arrive+BEAT);
    later(()=>{d.classList.add('tf-output-softmax');q('.tf-chart-title').textContent='softmax でスコアを確率に変換';},arrive+BEAT*2);
    later(()=>{d.classList.add('tf-output-ready');scaleOutput(true);},arrive+BEAT*3);
   }
  }else{
   if(stage>=2&&previous<=1&&!reduced.matches){d.classList.add('tf-space-moving');later(()=>d.classList.remove('tf-space-moving'),MOVE+100);}
   place(stage);values(true,stage);if(stage===1)d.classList.add('tf-position-added');}
 }
 function buildTokens(){
  d.classList.add('tf-initializing');
  const column=cls=>`<g class="${cls}"><path d="M-37 -28H-42V32H-37M37 -28H42V32H37" fill="none" stroke="currentColor"/><text font-family="monospace" font-size="12" text-anchor="middle"><tspan x="0" y="-10"></tspan><tspan x="0" y="9"></tspan><tspan x="0" y="27">⋮</tspan></text></g>`;
  q('.tf-tokens').innerHTML=c().tokens.map((t,i)=>`<g class="tf-token ${i===c().tokens.length-1?'tf-last':''}" data-word="${esc(t.text)}" style="color:${colors[i%colors.length]};fill:${colors[i%colors.length]}"><circle class="tf-halo" fill="none" r="31" stroke="#ba7147" stroke-width="3"/><rect class="tf-vector-shape" x="-8" y="-8" width="16" height="16" rx="8"/><text class="tf-word" x="0" y="-22" text-anchor="middle" font-size="16">${esc(t.text)}</text><text class="tf-numbers" text-anchor="middle" font-size="12" y="5"></text>${column('tf-column')}${column('tf-pe')}<text class="tf-pe-plus" x="0" y="60" text-anchor="middle" fill="#725789">＋</text></g>`).join('');
  // Grow the SVG for token rows and candidate rows; do not assume a tokenizer's length.
  output();show(current);
  // Commit new token positions before enabling transitions, including case switches.
  void d.offsetWidth;d.classList.remove('tf-initializing');
 }
 stages.forEach((label,i)=>{if(i>=3&&i<outputStage&&layers[i-2]>layers[i-3]+1){const gap=document.createElement('span');gap.className='tf-ellipsis';gap.textContent='…';gap.title='中間の層を省略';q('.tf-steps').append(gap);}const b=document.createElement('button');b.type='button';b.dataset.layer=i;b.textContent=label;b.addEventListener('click',()=>show(i));q('.tf-steps').append(b);});
 data.cases.forEach((item,i)=>{const b=document.createElement('button');b.type='button';b.dataset.negation=i===0?'off':'on';b.textContent=item.label;b.setAttribute('aria-pressed',String(i===caseIndex));b.addEventListener('click',()=>{caseIndex=i;qa('[data-negation]').forEach((el,j)=>el.setAttribute('aria-pressed',String(i===j)));buildTokens();});q('.tf-case-controls').append(b);});
 reduced.addEventListener('change',()=>show(current));q('.tf-live').hidden=false;d.classList.add('tf-enhanced');buildTokens();
})();
</script></body></html>
