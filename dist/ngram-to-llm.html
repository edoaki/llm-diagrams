/* Dark theme. navigation.js sets data-theme before paint from an explicit saved choice, defaulting to light.
   Figures and demos stay light "islands" because their hand-drawn SVGs assume a light ground. */
:root[data-theme=dark]{--ink:#e2e8e1;--muted:#a7b5a9;--green:#8fc6a2;--paper:#131916;--line:#2e3a32;--tint:#1d2821;--blue:#91b8d6;--accent:#e2a57c;--surface:#1a211d;--highlight:#6d5c1d;--panel:#1a211d;--note:#1c271f;--th:#1f2a22;--th-ink:#c5d9c3;color-scheme:dark}
[data-theme=dark] a:hover{color:#b6dcc2}
[data-theme=dark] :focus-visible{outline-color:#5f9c74}
[data-theme=dark] .skip{background:var(--surface)}
[data-theme=dark] .topbar{background:#131916f2}
[data-theme=dark] .sidenav a[aria-current=page]{background:#223326;color:#cfe8d6}
[data-theme=dark] .sidenav summary{color:#b3c7b2}
[data-theme=dark] .lead{color:#bccabd}
[data-theme=dark] .note{border-left-color:#6f8c5f}
[data-theme=dark] .note>strong{color:#b9d6a9}
[data-theme=dark] .card{background:var(--surface);color:var(--ink)}
[data-theme=dark] .card:hover{background:#202b24;border-color:#4a5d4c}
[data-theme=dark] .paper-label{background:#3a2c1d;color:#ecc79f}
[data-theme=dark] .sidenav .nav-category,[data-theme=dark] .sidenav small,[data-theme=dark] .sidenav a[data-parent]::before{color:var(--muted)}
[data-theme=dark] .publication-status{background:#1c241f;border-left-color:#6f8069}
[data-theme=dark] .legacy-links{border-color:var(--line)}
[data-theme=dark] .sidenav{scrollbar-color:#3a473e transparent}
/* Page containers drawn with their own light background (listed here so the palette lives in one place). */
[data-theme=dark] :is(figure,.demo,.light-island,.gnn-working,.gnn-replay,.ssm-detail,.audio-sample,.science-io>div:not(.science-arrow),.science-condition,.tf-cycle,.gnn-pipeline>div){--ink:#243b30;--muted:#5d6d60;--green:#35664d;--paper:#ffffff;--line:#e3e7e5;--tint:#f6f8f7;--blue:#4d7897;--accent:#ba7147;--surface:#fff;--panel:#f8f9f8;--note:#f6f8f7;--th:#f5f7f6;--th-ink:#456044;color:var(--ink);color-scheme:light}
[data-theme=dark] figure a:hover,[data-theme=dark] .demo a:hover{color:#183f2b}
.theme-toggle{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0;border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--muted)}
.theme-toggle:hover{color:var(--green);border-color:var(--green)}

@media print{.top-actions{display:none}}
:where([data-theme=dark]) :where(.light-island){background-color:#fcfcf8}

/* Shared editorial structure; page-specific visuals retain their existing styling. */
.article section { scroll-margin-top: 5rem; }
.article > h2[id] { margin: 3.25rem 0 1.5rem; scroll-margin-top: 5rem; }
.sidenav .nav-category { margin: 1rem .6rem .25rem; color: var(--nav-category); font-size: .75rem; }
.sidenav a[data-parent] { padding-left: 2.5rem; }
.sidenav small { display: inline; margin-left: .35rem; font-size: .67rem; color: #6a716b; }
.publication-status { padding: .8rem 1rem; border-left: 3px solid #9ca98d; background: var(--tint); font-size: .9rem; }
.publication-status p { margin: .4rem 0; }
.legacy-links { margin-top: 2rem; padding: .6rem 1rem; border: 1px solid var(--line); border-radius: .4rem; }
.article .cards { display: block; }
.article .cards p { margin: .7rem 0; }
figure > p > a > img, figure > p > img { max-width: 100%; height: auto; }
.article table { min-width: 0; }
@media (max-width: 820px) { .publication-status { font-size: .85rem; } }
.article section[id$="sources"] ul { font-size: 13px; }

.sidenav a[data-parent]::before { content: "↳ "; color: var(--nav-child); }

/* Colour roles for figures (docs/policy/03-figures.md#色の役割): input data, output (prediction),
   learned parameters, answer and loss, and everything else. Always pair colour with a direct label.
   Figures stay light in the dark theme, so they keep the light values; prose outside them gets lighter inks. */
:root,[data-theme=dark] :is(figure,.demo,.light-island){--role-input:#255f9e;--role-input-tint:#eef2f7;--role-input-line:#9db7d3;--role-output:#2c7a4f;--role-output-tint:#eef4f1;--role-output-line:#a0c3b0;--role-param:#a8407f;--role-param-tint:#f8f0f5;--role-param-line:#d8a9c5;--role-loss:#a9540f;--role-loss-tint:#f8f1ec;--role-loss-line:#d8b293;--role-neutral:#5d6d60;--role-neutral-tint:#f2f3f2;--role-neutral-line:#b6bdb7}
:root[data-theme=dark]{--role-input:#8db8e8;--role-input-tint:#273238;--role-input-line:#50697f;--role-output:#86c9a0;--role-output-tint:#25352c;--role-output-line:#4d715b;--role-param:#e59ac6;--role-param-tint:#352e32;--role-param-line:#7c5a6e;--role-loss:#eaa46a;--role-loss-tint:#352f23;--role-loss-line:#7f5f40;--role-neutral:#a7b5a9;--role-neutral-tint:#2b322e;--role-neutral-line:#5d6760}
/* Pick a role, then say how to paint it: .r-box (tinted shape), .r-line (stroke only), .r-mark (solid), .r-text, .r-chip. */
.r-input{--r:var(--role-input);--r-tint:var(--role-input-tint);--r-line:var(--role-input-line)}
.r-output{--r:var(--role-output);--r-tint:var(--role-output-tint);--r-line:var(--role-output-line)}
.r-param{--r:var(--role-param);--r-tint:var(--role-param-tint);--r-line:var(--role-param-line)}
.r-loss{--r:var(--role-loss);--r-tint:var(--role-loss-tint);--r-line:var(--role-loss-line)}
.r-neutral{--r:var(--role-neutral);--r-tint:var(--role-neutral-tint);--r-line:var(--role-neutral-line)}
svg .r-box{fill:var(--r-tint);stroke:var(--r)}
svg .r-line{fill:none;stroke:var(--r)}
svg .r-mark{fill:var(--r)}
.r-text{color:var(--r);fill:var(--r)}
.r-chip{display:inline-block;padding:0 .5em;border:1px solid var(--r-line);border-radius:4px;background:var(--r-tint);color:var(--r);font-weight:650;line-height:1.7;white-space:nowrap}

/* Illustrated paper explanation (docs/policy/02-papers-and-sources.md#図付き解説の型). */
.article .paper-explainer{margin:40px 0;padding:6px 24px 10px;border:1px solid var(--line);border-top:3px solid var(--green);border-radius:8px;background:var(--surface)}
.paper-explainer::before{content:"論文解説";display:block;margin-top:14px;color:var(--green);font-size:11px;font-weight:700;letter-spacing:.14em}
.article .paper-explainer>h3{margin:4px 0 2px;scroll-margin-top:92px}
.paper-explainer>.paper-meta{margin:0 0 18px;color:var(--muted);font-size:13px;line-height:1.8}
.paper-explainer>h4{margin:26px 0 4px;color:var(--th-ink);font-size:13px;font-weight:700;letter-spacing:.04em}
.paper-explainer>h4+p{margin-top:4px}
.paper-explainer figure{margin:18px 0}
/* Input → output pair: each side takes its colour role; a leading bold word becomes the side's label. */
.io-pair{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:stretch;margin:16px 0}
.io-pair::before{content:"→";grid-column:2;grid-row:1;align-self:center;color:var(--muted);font-size:20px}
.io-pair>.io-in,.io-pair>.io-out{min-width:0;padding:10px 16px;border:1px solid var(--r-line);border-radius:8px;background:var(--r-tint)}
.io-pair>.io-in{--r:var(--role-input);--r-tint:var(--role-input-tint);--r-line:var(--role-input-line);grid-column:1;grid-row:1}
.io-pair>.io-out{--r:var(--role-output);--r-tint:var(--role-output-tint);--r-line:var(--role-output-line);grid-column:3;grid-row:1}
.io-pair p{margin:6px 0;font-size:14px;line-height:1.8}
.io-pair>div>p:first-child>strong:first-child{display:block;color:var(--r);font-size:12px;letter-spacing:.06em}
.io-pair img{display:block;max-width:100%;height:auto;margin:6px auto;border-radius:4px}
@media(max-width:520px){.article .paper-explainer{padding:4px 16px 8px}.io-pair{grid-template-columns:minmax(0,1fr)}.io-pair::before{content:"↓";grid-column:1;grid-row:2;justify-self:center}.io-pair>.io-in{grid-column:1;grid-row:1}.io-pair>.io-out{grid-column:1;grid-row:3}}

/* Toggles in the body: optional depth that the main line never depends on (docs/policy/01-overall.md#トグル折りたたみ). */
main.article details{margin:24px 0;padding:0 20px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
main.article details>summary{display:flex;align-items:center;gap:12px;min-height:48px;margin:0 -20px;padding:10px 20px;border-radius:7px;list-style:none;color:var(--ink);font-size:15px;font-weight:650;line-height:1.6;cursor:pointer}
main.article details>summary::-webkit-details-marker{display:none}
main.article details>summary::before{content:"";flex:none;width:7px;height:7px;margin:0 3px 0 1px;border-right:2px solid var(--green);border-bottom:2px solid var(--green);transform:rotate(-45deg);transition:transform .15s}
main.article details>summary:hover{background:var(--tint)}
main.article details[open]{padding-bottom:6px}
main.article details[open]>summary{margin-bottom:8px;border-bottom:1px solid var(--line);border-radius:7px 7px 0 0}
main.article details[open]>summary::before{transform:rotate(45deg)}
main.article details details{background:var(--tint)}
@media(max-width:520px){main.article details{padding:0 14px}main.article details>summary{margin:0 -14px;padding:10px 14px;font-size:14px}}
@media(prefers-reduced-motion:reduce){main.article details>summary::before{transition:none}}
@media print{main.article details>summary::before{display:none}}

/* New introductory pages: readable text, progressive-enhancement diagrams. */
.article > h2 { margin-top: 3.2rem; scroll-margin-top: 6rem; }
.learning-demo { background: #fff; border: 1px solid #d5dfd5; border-radius: 10px; }
.ld-body { padding: 24px; }
.ld-eyebrow { color: #516d59; font-size: 12px; letter-spacing: .08em; margin: 0 0 12px; }

.ld-controls { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0 8px; align-items: center; }

.ld-controls button, .ld-controls select { border: 1px solid #8ba58e; border-radius: 6px; background: #f8faf5; color: #243b30; padding: 10px 14px; min-height: 44px; max-width: 100%; }
.ld-controls button:hover { background: #e9f0e4; }

.ld-controls button[aria-pressed="true"] { background: #35664d; color: white; }

.ld-status { background: #f0f5ec; padding: 14px 16px; border-radius: 6px; font-size: 14px; min-height: 4em; overflow-wrap: anywhere; }
.ld-bars { display: grid; gap: 16px; }
.ld-bar-label { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; font-size: 14px; }

.ld-fill.alt { background: #537f9b; }

.ld-token { background: #ecf2e7; border: 1px solid #a9bea5; border-radius: 5px; padding: 8px 12px; }
.ld-token:last-child { background: #35664d; color: white; }
.ld-candidate { padding: 12px; border-left: 3px solid #7595ad; background: #f2f6fa; }
.ld-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.ld-card { padding: 14px 10px; border: 1px solid #d5dfd5; border-radius: 6px; background: #fafbf7; text-align: center; }
.ld-card strong, .ld-card span { display: block; }

.decoder .dc-toolbar button:disabled{opacity:.4;cursor:default}

/* 01 network. Lines end at the node's edge and nodes are opaque, so nothing shows through a circle even while it fades. */
.dc-net{transition:opacity .5s}
.dc-edge{stroke:#d5e0e8;stroke-width:2;transition:stroke .5s,opacity .5s}
.dc-edge[data-state=active]{stroke:#f0d7c2}
.dc-edge.is-self{stroke:var(--orange);stroke-width:3;opacity:0}
.dc-link{fill:none;stroke:var(--blue);stroke-width:2;opacity:0;transition:opacity .5s}
[data-sub="1"] .dc-link,[data-sub="1"] .dc-edge.is-self{opacity:.9;stroke-dasharray:7 6;animation:dc-flow 1.2s linear infinite}
[data-sub="2"] .dc-link{opacity:.3}
[data-sub="2"] .dc-edge.is-self{opacity:.55}
.dc-node{fill:#fbfcfd;stroke:var(--pale-blue);stroke-width:2;transform-box:fill-box;transform-origin:center;transition:fill .5s,stroke .5s,opacity .5s,transform .5s}
.dc-node[data-state=active]{stroke:var(--pale-orange)}
.dc-node[data-state=cached]{fill:#f6f8fa;stroke:var(--blue);stroke-opacity:.35;transition:r .65s ease-in-out,stroke-opacity .65s ease-in-out,fill .65s ease-in-out,stroke .65s ease-in-out,transform .65s ease-in-out}
/* Keep outlines inside the shape so changing their colour never enlarges its silhouette. */
circle.dc-node{clip-path:circle(50%) fill-box}
rect.dc-node{clip-path:inset(0 round 3px) fill-box}
circle.dc-node[data-state=cached]{r:7.2px}
rect.dc-node[data-state=cached]{transform:scale(.8)}
.dc-node.is-highlighted[data-state=cached]{stroke-opacity:1}
circle.dc-node.is-highlighted[data-state=cached]{r:9px}
rect.dc-node.is-highlighted[data-state=cached]{transform:scale(1)}
.dc-node.is-past[data-state=cached]{fill:#dce7f0}
.dc-node.is-past[data-state=active]{fill:#f7e3d2}
.dc-node.is-source[data-state=active]{fill:#fcdfc4;stroke:var(--orange)}
.dc-node.is-target{fill:var(--orange);stroke:var(--orange)}
.dc-node.is-pending{fill:#fff;stroke-dasharray:4 3;transform:scale(.85)}
.dc-node.dc-made{animation:dc-pop .6s ease}
.decoder svg .dc-word{font-size:14px;fill:#304c5c;font-weight:600;transform-box:fill-box;transform-origin:center;transition:fill .4s,opacity .4s}
.decoder svg .dc-word.is-active{fill:var(--orange);font-weight:700}
.decoder svg .dc-word.is-picked{fill:var(--green);font-weight:700}
.dc-word.dc-drop{animation:dc-drop .6s cubic-bezier(.2,.8,.2,1)}
.decoder .is-hidden{opacity:0;pointer-events:none}
.dc-word.is-hidden,.dc-node.is-hidden,.dc-edge.is-hidden{transition:none}
/* Only the final representation remains: it grows out of its node, then feeds the output layer. */
.is-output .dc-net{opacity:0}
.dc-card{opacity:0;transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .4s;pointer-events:none}
.dc-card rect{fill:#fdf1e6;stroke:var(--orange);stroke-width:1.5}
.dc-card .dc-card-vector rect{fill:var(--orange);stroke:none}
.decoder svg .dc-card-word{font-size:17px;font-weight:700;fill:#304c5c}
.decoder svg .dc-card-caption{font-size:10px}
.is-output .dc-card{opacity:1}
.dc-out-layer{opacity:0;transform:translateX(12px);transition:opacity .5s,transform .5s}
.dc-out-layer rect{fill:#e7eef2;stroke:#7f98a8;stroke-width:1.5;transition:fill .5s}
.decoder svg .dc-out-layer text{font-weight:700;fill:#284b60;transition:fill .5s}
.is-output .dc-out-layer{opacity:1;transform:none;transition-delay:.4s}
.is-ready .dc-out-layer rect{fill:#284b60;stroke:#284b60}
.decoder.is-ready svg .dc-out-layer text{fill:#fff}
.dc-out-arrow{opacity:0;transition:opacity .4s .3s}
.dc-out-arrow line{stroke:var(--orange);stroke-width:2.5;stroke-dasharray:8 6}
.dc-out-arrow path{fill:var(--orange)}
.is-output .dc-out-arrow{opacity:1;transition-delay:.7s}
.is-output:not(.is-ready) .dc-out-arrow line{animation:dc-flow .8s linear infinite}

/* 02 right panel: the space, replaced by the probabilities once only the final representation remains. */
.dc-right-body{display:grid;align-items:center}

</main><script>/* Shared reader is embedded in every standalone HTML; no fetch or external assets. */
'use strict';
(() => {
 const data=JSON.parse(document.querySelector('#diagram-data').textContent);
 const fail=message=>{throw new Error('図のデータ: '+message);};
 const finite=n=>typeof n==='number'&&Number.isFinite(n);
 const vector=(v,n,label)=>{if(!Array.isArray(v)||v.length!==n||!v.every(finite))fail(label+'の成分数または値が不正です');};
 const model=data.model;
 if(data.schemaVersion!==1)fail('schemaVersionは1が必要です');
 if(!['illustrative','measured'].includes(model.status))fail('model.statusが不正です');
 if(!Number.isInteger(model.numLayers)||model.numLayers<1)fail('numLayersは正の整数です');
 const layers=[...new Set([1,Math.min(2,model.numLayers),model.numLayers])];
 const dims=model.componentIndices;
 if(!Array.isArray(dims)||dims.length<2||new Set(dims).size!==dims.length||!dims.every(n=>Number.isInteger(n)&&n>=0&&n<model.hiddenSize))fail('componentIndicesを確認してください');
 if(!['sinusoidal','learned_absolute','rope','other'].includes(model.positionEncoding.type))fail('位置情報の方式を確認してください');
 if(model.status==='measured'&&(!model.id||!model.extraction?.hiddenStateDefinition))fail('実測にはモデル名とhiddenStateDefinitionが必要です');
 const additive=['sinusoidal','learned_absolute'].includes(model.positionEncoding.type);
 const checkToken=t=>{
  if(typeof t.text!=='string')fail('トークンtextが必要です');
  if(model.status==='measured'&&!Number.isInteger(t.id))fail('実測にはtoken idが必要です');
  vector(t.embedding,dims.length,'embedding');vector(t.input,dims.length,'input');
  if(additive)vector(t.position,dims.length,'position');
  for(const l of layers)vector(t.layers[String(l)],dims.length,'layer '+l);
  for(const l of [0,...layers]){vector(t.points[String(l)],2,'points '+l);if(t.points[String(l)].some(n=>n<0||n>1))fail('pointsは0〜1です');}
 };
 const checkCandidates=(cs,index)=>{
  if(!Array.isArray(cs)||!cs.length)fail('候補がありません');
  if(cs.some(c=>typeof c.text!=='string'||!finite(c.probability)||c.probability<0||c.probability>1))fail('確率は0〜1です');
  if(model.status==='measured'&&cs.some(c=>c.text!=='その他'&&!Number.isInteger(c.tokenId)))fail('実測候補のtokenIdが必要です');
  if(Math.abs(cs.reduce((s,c)=>s+c.probability,0)-1)>1e-6)fail('その他を含む確率の合計を1にしてください');
  if(!Number.isInteger(index)||index<0||index>=cs.length||cs[index].text==='その他')fail('selectedIndexを確認してください');
 };
 if(!Array.isArray(data.cases)||data.cases.length!==2||data.cases[0].key!=='positive'||data.cases[1].key!=='negative')fail('casesはpositive、negativeの順の2条件です');
 if(!['illustrative','measured'].includes(model.projection.status)||!model.projection.method)fail('配置の出所を記録してください');
 for(const c of data.cases){
  if(typeof c.prompt!=='string'||typeof c.label!=='string'||!Array.isArray(c.continuation))fail('入力文・ラベル・continuationを確認してください');
  if(!c.tokens?.length)fail('tokensが空です');c.tokens.forEach(checkToken);checkCandidates(c.candidates,c.selectedIndex);
  // Optional: candidates predicted at an earlier prompt position must contain the actual next input token.
  c.tokens.forEach((t,i)=>{
   if(t.candidates===undefined)return;
   const next=c.tokens[i+1];if(!next)fail('最後の入力トークンの候補はcase.candidatesに書いてください');
   const index=Array.isArray(t.candidates)?t.candidates.findIndex(v=>v.text===next.text):-1;
   checkCandidates(t.candidates,index);
   if(model.status==='measured'&&t.candidates[index].tokenId!==next.id)fail('途中位置の候補に次の入力トークンのtokenIdが必要です');
  });
  let selected=c.candidates[c.selectedIndex];
  for(const s of c.continuation){checkToken(s.token);if(s.token.text!==selected.text||s.token.id!==selected.tokenId)fail('続きのトークンが直前の選択と一致しません');checkCandidates(s.candidates,s.selectedIndex);selected=s.candidates[s.selectedIndex];}
 }
 const ng=data.ngram,m=ng.matrix;
 if(!['illustrative','measured'].includes(ng.status)||(ng.status==='measured'&&!ng.source))fail('N-gram実測の出典が必要です');
 if(m.status!=='illustrative')fail('並べ替え表は説明用スコアとして保持してください');

    el.classList.toggle('is-pending',target&&flows&&sub<2);
    if(!target)el.classList.remove('dc-made');
   });
   $$('.dc-edge').forEach(el=>{
    const [i,k]=el.dataset.edge.split('-').map(Number);
    el.dataset.state=i<t?'cached':'active';
    el.classList.toggle('is-hidden',!(shown(i,k)&&shown(i,k-1)));
    el.classList.toggle('is-self',flows&&i===t&&k===done);
   });
   // Information from every earlier word's node in the row below flows into the new node.
   const key=`${ci}:${step}`;
   if(key!==builtFor){
    builtFor=key;
    let l='';
    if(flows)for(let i=0;i<t;i++){
     const sx=x(i),sy=y(done-1)-edge(done-1),ex=x(t),ey=y(done)+edge(done),d=sy-ey;
     l+=`<path class="dc-link" d="M${r1(sx)} ${r1(sy)} C${r1(sx)} ${r1(sy-d*.55)} ${r1(ex)} ${r1(ey+d*.45)} ${r1(ex)} ${r1(ey)}"/>`;
    }
    links.innerHTML=l;
    probs.innerHTML=cur.cs.map((v,r)=>`<div class="dc-prob${v.text==='その他'?' is-other':''}" role="listitem"><span class="dc-prob-word">${esc(v.text.trim()||v.text)}</span><span class="dc-track"><span class="dc-fill"></span></span><b>${percent(v.probability)}</b></div>`).join('');
   }
   $$('[data-row-label]').forEach(el=>el.classList.toggle('dc-row-current',!output&&+el.dataset.rowLabel===done));
   $$('.dc-word').forEach(el=>{
    const i=+el.dataset.word;
    el.classList.toggle('is-hidden',!(i<=t||picked&&i===t+1));
    el.classList.toggle('is-active',i===t);
    el.classList.toggle('is-picked',picked&&i===t+1);
   });
   // The final representation grows out of its node and moves beside the output layer.
   const vector=t===n-1?data.ngram.features[c.key]:c.tokens[t].layers[String(N)];
   // The illustrative card is a fixed-width vector glyph, matching the embedded N-gram card.
   const glyphSize=data.ngram.features[c.key].length;
   const cardVector=data.model.status==='illustrative'&&vector.length!==glyphSize?Array.from({length:glyphSize},(_,j)=>{
    const p=j*(vector.length-1)/Math.max(1,glyphSize-1),a=Math.floor(p),b=Math.ceil(p);

   }):vector;
   const [vx,vy]=output?[cardLeft,midY]:[x(t),y(count)];
   card.style.transform=`translate(${r1(vx)}px,${r1(vy)}px) scale(${output?1:.1})`;
   card.querySelector('.dc-card-word').textContent=words[t].trim();
   card.querySelector('.dc-card-vector').innerHTML=cardVector.map((v,j)=>`<rect x="${r1(j*20-cardVector.length*10+2)}" y="14" width="16" height="11" rx="2" opacity="${r1(Math.max(.15,Math.min(1,Math.abs(v))))}"><title>${format(v)}</title></rect>`).join('');
   // Probabilities replace the space once only the final representation remains.
   const best=Math.max(...cur.cs.map(v=>v.probability));
   $('.dc-right').classList.toggle('is-probs',output);
   $('.dc-right-title').textContent=output?'02　次のトークンの確率':'02　表現の空間';
   [...probs.children].forEach((row,r)=>{
    const p=cur.cs[r].probability;
    row.classList.toggle('is-top',ready&&!picked&&p===best);
    row.classList.toggle('is-chosen',picked&&r===cur.chosen);
    row.classList.toggle('is-muted',picked&&r!==cur.chosen);

   });
   const glide=spaceCycle===cycle&&!root.classList.contains('dc-instant');spaceCycle=cycle;

   if(effect==='made')replay($('.dc-node.is-target'),'dc-made');
   if(effect==='enter'&&phase===0)replay($('.dc-node.is-target'),'dc-made');
   if(effect==='enter'&&picked)replay($('.dc-word.is-picked'),'dc-drop');
   const chip=$('.dc-step');
   chip.textContent=picked?'選択':output?'出力':label(done);
   chip.classList.toggle('is-output',output);
   $('[data-dc-back]').disabled=step===0;
   $('[data-dc-next]').disabled=step===total-1;
   $('.dc-count').textContent=`${step+1} / ${total}`;
  }

  const stop=()=>{timers.forEach(clearTimeout);timers=[];};
  // Forward: a layer's new node appears first, information flows into it, then it forms; the output layer lights up once the card arrives.
  function play(to){
   stop();step=to;
   const phase=step%perCycle,flows=phase>=1&&phase<=count&&phase!==gapK;
   if(phase===gapK){sub=2;render('made');return;}
   if(motion.matches||!(flows||phase===OUTPUT)){sub=2;render('enter');return;}
   sub=0;render('enter');
   const at=phase===OUTPUT?[900,1800]:[700,1900];
   timers=[setTimeout(()=>{sub=1;render();},at[0]),setTimeout(()=>{sub=2;render('made');},at[1])];
  }
  // Backward, reset and sentence changes show the finished state without motion.
  function show(to){
   stop();step=to;sub=2;root.classList.add('dc-instant');render();
   root.getBoundingClientRect();root.classList.remove('dc-instant');
  }
  $('[data-dc-next]').addEventListener('click',()=>{if(step<total-1)play(step+1);});
  $('[data-dc-back]').addEventListener('click',()=>show(Math.max(0,step-1)));
  $('[data-dc-reset]').addEventListener('click',()=>show(0));
  $$('[data-dc-case]').forEach(b=>b.addEventListener('click',()=>{if(ci===+b.dataset.dcCase)return;ci=+b.dataset.dcCase;build();show(Math.min(step,total-1));}));
  motion.addEventListener('change',()=>show(step));
  build();show(0);
  // Embedding pages call settle() when the diagram is hidden, so no delayed step fires off-screen.
  return {settle:()=>show(step)};
 }
 document.querySelectorAll('[data-decoder]').forEach(el=>{el.decoderDiagram=mount(el);});
})();

'use strict';
(() => {
 const root=document.querySelector('#ng-demo');if(!root)return;
 const q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];
 const {data,format,percent}=window.Diagram;
 const {contexts,words,probabilities,matrix:matrixData}=data.ngram;
 const stages=['確率表','並べ替える','傾向で推測','文脈から予測'];
 let step=0,context=0,sortPhase=0,revealed=false;
 const illustrative=s=>s!=='measured';
 const makeButton=(label,fn)=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.addEventListener('click',fn);return b;};
 stages.forEach((label,i)=>{const b=makeButton(`${i+1} ${label}`,()=>go(i));b.dataset.stage=i;q('.ng-steps').append(b);});

 // Scene 1: column headers select the context, so the table itself is the control.
 const table=q('.ng-prob-table');
 table.style.gridTemplateColumns=`minmax(60px,.8fr) repeat(${contexts.length},minmax(70px,1fr))`;
 for(let row=-1;row<words.length;row++)for(let col=-1;col<contexts.length;col++){
  const head=row===-1&&col>=0,cell=head?makeButton(contexts[col],()=>{context=col;renderContext();}):document.createElement('div');
  cell.className='ng-cell'+(row===-1?' ng-colhead':col===-1?' ng-rowhead':'');
  if(!head)cell.textContent=row===-1?'y ＼ x':col===-1?words[row]:percent(probabilities[col][row]);
  if(col>=0)cell.dataset.col=col;if(head)cell.dataset.context=col;table.append(cell);
 }
 function renderContext(){
  qa('[data-context]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.context===context)));
  qa('[data-col]').forEach(c=>c.classList.toggle('ng-selected',+c.dataset.col===context));
 }

 // Scenes 2–3: one score matrix whose cells move between layouts.
 const matrix=q('.ng-matrix');
 const {words:matrixWords,contexts:matrixContexts,values,rowOrder:rowShuffled,columnOrder:colShuffled,rowSwap,columnSwap,hiddenCell}=matrixData;
 // Sorting steps through the row swap, the column swap, then the rest at once; each button names its operation.
 const sortOps=[
  {back:'◀ 戻す',next:'行を入れ替える ▶'},
  {back:'◀ 行を元に戻す',next:'列を入れ替える ▶'},
  {back:'◀ 列を元に戻す',next:'残りをまとめて並べ替える ▶'},
  {back:'◀ まとめて並べ替える前に戻す',next:'並べ替え完了'}];
 const rowH=54,top0=54,colW=80/matrixContexts.length;
 for(let r=0;r<matrixWords.length;r++)for(let c=0;c<matrixContexts.length;c++){const el=document.createElement('div');el.className='ng-number';el.dataset.r=r;el.dataset.c=c;el.style.setProperty('--value',(values[r][c]-matrixData.range[0])/(matrixData.range[1]-matrixData.range[0])*5);matrix.append(el);}
 for(const [axis,labels] of [['x',matrixContexts],['y',matrixWords]])labels.forEach((label,i)=>{const el=document.createElement('span');el.className=`ng-axis ng-${axis}`;el.dataset.index=i;el.textContent=label;matrix.append(el);});
 const corner=document.createElement('span');corner.className='ng-axis ng-corner';corner.textContent='y ＼ x';matrix.append(corner);
 matrix.style.height=(top0+matrixWords.length*rowH+8)+'px';
 qa('.ng-number,.ng-axis.ng-x').forEach(el=>el.style.width=(colW-4)+'%');
 q('.ng-matrix-badge').textContent=`スコア ${matrixData.range.join('〜')}`;
 function renderMatrix(){
  const layoutPhase=step===2?3:sortPhase;
  const swap=(order,a,b)=>order.map(i=>i===a?b:i===b?a:i);
  const rowOrder=layoutPhase===3?matrixWords.map((_,i)=>i):layoutPhase>=1?swap(rowShuffled,...rowSwap):rowShuffled;
  const colOrder=layoutPhase===3?matrixContexts.map((_,i)=>i):layoutPhase>=2?swap(colShuffled,...columnSwap):colShuffled;
  const highlighted=(r,c)=>step===1&&(sortPhase===1&&rowSwap.includes(r)||sortPhase===2&&columnSwap.includes(c));
  const masked=(r,c)=>step===2&&r===hiddenCell[0]&&c===hiddenCell[1]&&!revealed;
  const x=pos=>(16+pos*colW)+'%',y=pos=>(top0+pos*rowH)+'px';
  qa('.ng-number').forEach(el=>{const r=+el.dataset.r,c=+el.dataset.c;el.style.left=x(colOrder.indexOf(c));el.style.top=y(rowOrder.indexOf(r));el.textContent=masked(r,c)?'?':format(values[r][c]);el.classList.toggle('ng-hidden-value',masked(r,c));el.classList.toggle('ng-answer',step===2&&revealed&&r===hiddenCell[0]&&c===hiddenCell[1]);el.classList.toggle('ng-swapped',highlighted(r,c));});
  qa('.ng-axis.ng-x,.ng-axis.ng-y').forEach(el=>{const isX=el.classList.contains('ng-x'),pos=(isX?colOrder:rowOrder).indexOf(+el.dataset.index);el.style.left=isX?x(pos):'0';el.style.top=isX?'0':y(pos);el.classList.toggle('ng-swapped',highlighted(isX?-1:+el.dataset.index,isX?+el.dataset.index:-1));});
  const layoutLabel=layoutPhase===3?'並べ替えた配置':layoutPhase===0?'元の配置':'並べ替え中';
  matrix.setAttribute('aria-label',`${layoutLabel}のスコア表。列：${colOrder.map(c=>matrixContexts[c]).join('、')}。${rowOrder.map(r=>matrixWords[r]+'：'+colOrder.map(c=>masked(r,c)?'はてな':format(values[r][c])).join('、')).join('。')}`);
  q('.ng-matrix-title').textContent=step===2?'傾向があれば、見ていない組み合わせ「?」も推測しやすい':'行と列を並べ替えると、表の傾向が見えてくる';
  const back=q('[data-sort-back]'),next=q('[data-sort-next]');
  back.hidden=next.hidden=step!==1;
  back.textContent=sortOps[sortPhase].back;back.disabled=sortPhase===0;
  next.textContent=sortOps[sortPhase].next;next.disabled=sortPhase===3;
  q('[data-reveal]').hidden=step!==2;
  q('[data-reveal]').textContent=revealed?'もう一度隠す':'答えを見る';
  q('[data-reveal]').setAttribute('aria-expanded',String(revealed));
  q('.ng-matrix-note').hidden=step!==2||!revealed;
  q('.ng-matrix-note').textContent=`${matrixContexts[hiddenCell[1]]} → ${matrixWords[hiddenCell[0]]}：${format(values[hiddenCell[0]][hiddenCell[1]])}`;
 }

 // Scene 4 embeds the decoder diagram (components/decoder-kv-cache), computing only the last word.
 const decoder=q('[data-decoder]').decoderDiagram;

 function go(n){step=n;root.dataset.step=step;
  qa('[data-stage]').forEach(b=>{if(+b.dataset.stage===step)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');});
  const panel=['table','matrix','matrix','attention'][step];qa('[data-panel]').forEach(p=>p.hidden=p.dataset.panel!==panel);
  q('[data-prev]').disabled=step===0;q('[data-next]').disabled=step===stages.length-1;q('.ng-page').textContent=`${step+1} / ${stages.length}`;
  renderContext();renderMatrix();decoder.settle();
 }
 q('[data-prev]').addEventListener('click',()=>go(Math.max(0,step-1)));q('[data-next]').addEventListener('click',()=>go(Math.min(stages.length-1,step+1)));
 q('[data-sort-back]').addEventListener('click',()=>{sortPhase=Math.max(0,sortPhase-1);renderMatrix();});
 q('[data-sort-next]').addEventListener('click',()=>{sortPhase=Math.min(3,sortPhase+1);renderMatrix();});
 q('[data-reveal]').addEventListener('click',()=>{revealed=!revealed;renderMatrix();});
 q('figcaption').textContent=(illustrative(data.model.status)?'':`予測はモデル ${data.model.id} の実測値。`)+'線はAttentionの重みではありません。';
 q('.ng-interactive').hidden=false;q('.ng-fallback').hidden=true;go(0);
})();
