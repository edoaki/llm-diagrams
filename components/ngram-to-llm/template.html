<figure class="ng-demo" id="ng-demo" aria-label="N-gramからTransformerへ">

 <div class="ng-interactive" hidden>
  <nav class="ng-steps" aria-label="説明の場面"></nav>
  <div class="ng-stage">
   <section class="ng-panel" data-panel="table"><div class="ng-ngram-intro"><h2>N-gram</h2><p>直前の N−1 語を条件に、出現頻度から次の語の確率を求めます。</p><div class="ng-ngram-example"><span class="ng-example-label">4-gramの例<br>（単語単位）</span><span><small>文脈 x：直前の3語</small><b>I live in</b></span><span aria-hidden="true">→</span><span><small>次の語 y</small><b>Tokyo</b></span></div></div><div class="ng-probability"><strong>p(y | x)</strong><span>文脈 x の次に単語 y が続く確率</span></div><p class="ng-axes">次の単語 y ↓ ／ 文脈 x →</p><div class="ng-contexts" aria-label="文脈を選ぶ"></div><div class="ng-prob-table"></div><p class="ng-table-note">各列の合計＝100%</p></section>
   <section class="ng-panel" data-panel="matrix" hidden><h2 class="ng-matrix-title"></h2><p class="ng-scene-intro ng-matrix-intro"></p><div class="ng-panel-head"><span class="ng-label ng-matrix-order" role="status">ばらばらな配置</span><span class="ng-badge">文脈との合い方：0〜5（説明用）</span></div><p class="ng-axes">次に続く単語 ↓ ／ 文脈 →</p><p class="ng-scroll-hint">表は左右にスクロールできます ↔</p><div class="ng-matrix-scroll" tabindex="0" role="region" aria-label="スコア表（狭い画面では横にスクロールできます）"><div class="ng-matrix" role="img" aria-label="ばらばらな配置のスコア表"></div></div><p class="ng-score-note">高いほど文脈に合う、説明用の仮スコアです。実測値や確率ではありません。</p><div class="ng-sort-controls"><p class="ng-sort-instruction"></p><div class="ng-actions"><button type="button" data-sort-back>← 1操作戻す</button><button type="button" data-sort>次の操作 →</button><button type="button" data-sort-reset>最初の配置</button></div></div><div class="ng-structure-controls" hidden><div class="ng-contexts" aria-label="表の配置"><button type="button" data-layout="original">元の配置</button><button type="button" data-layout="sorted">並べ替えた配置</button></div><button type="button" data-reveal>隠した値を確かめる</button></div><p class="ng-matrix-note" role="status"></p><div class="ng-structure-bridge" hidden><h3>表の傾向を、共通の計算で表す</h3><p>文脈や単語に共通の特徴があれば、その特徴を使って各語のスコアを計算できます。新しい文脈にも、学習した特徴と同じ計算を使います。</p><div class="ng-bridge-flow">文脈 x → 特徴 → 各語のスコア（表の1列）</div><p>では、文脈の特徴はどう作るのでしょうか。次はTransformerの中を見ます。</p><small>並べ替えは傾向を見るための例です。実際のモデルは、文章から特徴と計算のパラメータを学びます。</small></div></section>
   <section class="ng-panel" data-panel="attention" hidden><h2>文脈から予測を作る</h2><p class="ng-scene-intro">前の場面の「文脈 → 特徴 → スコア」を、同じ題材の文で見てみます。Transformerは前の語の情報を取り込み、文脈を表す特徴を作ります。その特徴から各語のスコアを計算し、確率の1列にします。</p><div class="ng-bridge-flow">文脈 x → Transformerで特徴を作る → 次の語の確率</div><div class="ng-contexts" aria-label="予測する文脈"><button type="button" data-bank="money">事業への融資</button><button type="button" data-bank="river">大雨の後の川岸</button></div><div class="ng-playback-controls"><span class="ng-playback-state"></span><button type="button" data-playback>一時停止</button><button type="button" data-replay>最初から再生</button></div><p class="ng-sentence"></p><div class="ng-computation"><div class="ng-attention"><p class="ng-computation-label">① 文脈の特徴を作る</p><div class="ng-sources"></div><svg class="ng-links" viewBox="0 0 600 110" preserveAspectRatio="none" aria-hidden="true"><path d="M 100 0 Q 100 60 300 105"/><path d="M 300 0 L 300 105"/><path d="M 500 0 Q 500 60 300 105"/></svg><div class="ng-bank"><strong>bank</strong><span class="ng-bank-caption">入力時の表現</span><div class="ng-bank-vector ng-vector"></div></div><div class="ng-process"><span>Attentionで情報を取り込む</span><span>取り込んだ情報を加工する</span></div></div><span class="ng-computation-arrow" aria-hidden="true">→</span><div class="ng-bank-output"><p class="ng-prediction-label">bank の表現 → 語ごとのスコア → softmax</p><strong>② 次の語の確率 p(y | x)</strong><small>この文脈に対応する、確率表の1列</small><div class="ng-next-bars"></div><p class="ng-completion"></p></div></div><p class="ng-attention-note">確率は説明用です。Attentionの重みではなく、文脈を取り込んだ表現から作る出力を示しています。</p></section>
  </div>
  <p class="ng-copy" aria-live="polite"></p>

 </div>
 <div class="ng-fallback"><p>N-gramは、直前の N−1 語を条件に、出現頻度から次の語の確率を求めます。</p><p>文脈 x と次の単語 y の関係を、条件付き確率 p(y | x) の表で考えます。</p><p>ニューラル言語モデルは、学習した特徴と共通の計算で次の単語の確率を作ります。Transformerは、Attentionなどを通して文脈の表現を作る仕組みです。</p><p>JavaScriptを有効にすると、4場面を操作できます。</p></div>
 <figcaption>数値と図は説明用で、実モデルの計算結果ではありません。</figcaption>
 <details class="ng-details"><summary>補足・参考文献</summary><p>N-gramは直前のN−1個のトークンを条件に予測します。表の参照自体は高速にできますが、長い文脈では組み合わせが増え、観測できない組み合わせが多くなります。ニューラル言語モデルは特徴とパラメータを共有します。Transformerでも文脈が長くなると計算量は増えます。</p><p>並べ替えだけでは情報量は減りません。単純な傾向での近似には誤差があり、任意の表が単純になるわけでもありません。Attentionの重みと、次の単語の確率は別のものです。実際のモデルは単語ではなくトークンを扱います。</p><p><a href="https://jmlr.org/papers/volume3/bengio03a/bengio03a.pdf">Bengio et al. (2003), A Neural Probabilistic Language Model</a><br><a href="https://arxiv.org/abs/1706.03762">Vaswani et al. (2017), Attention Is All You Need</a></p></details>
</figure>
