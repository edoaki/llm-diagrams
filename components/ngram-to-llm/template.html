<figure class="ng-demo" id="ng-demo" aria-label="N-gramからTransformerへ">

 <div class="ng-interactive" hidden>
  <nav class="ng-steps" aria-label="説明の場面"></nav>
  <div class="ng-stage">
   <section class="ng-panel" data-panel="table"><h2>N-gramは、文脈ごとの次の語の確率を表で覚える</h2><div class="ng-panel-head"><span class="ng-formula">p(y | x)</span><span class="ng-legend">x：文脈 ／ y：次の語 ／ 各列の合計 100%</span></div><div class="ng-prob-table"></div></section>
   <section class="ng-panel" data-panel="matrix" hidden><h2 class="ng-matrix-title"></h2><div class="ng-panel-head"><div class="ng-toolbar"><button type="button" data-sort-back></button><button type="button" data-sort-next></button><button type="button" data-reveal></button><span class="ng-matrix-note" role="status"></span></div><span class="ng-badge ng-matrix-badge"></span></div><p class="ng-scroll-hint">↔</p><div class="ng-matrix-scroll" tabindex="0" role="region" aria-label="スコア表（狭い画面では横にスクロールできます）"><div class="ng-matrix" role="img"></div></div></section>
   <section class="ng-panel" data-panel="attention" hidden><h2>Transformerは、層ごとに前の語の情報を取り込み、次の語の確率を出す</h2><div class="decoder" data-decoder data-cycles="last" data-case-select></div></section>
  </div>
  <footer class="ng-navigation"><button type="button" data-prev>← 前の場面</button><span class="ng-page"></span><button type="button" data-next>次の場面 →</button></footer>
 </div>
 <div class="ng-fallback"><p>N-gramは、直前の N−1 語を条件に、出現頻度から次の語の確率を求めます。</p><p>文脈 x と次の単語 y の関係を、条件付き確率 p(y | x) の表で考えます。</p><p>ニューラル言語モデルは、学習した特徴と共通の計算で次の単語の確率を作ります。Transformerは、Attentionなどを通して文脈の表現を作る仕組みです。</p><p>JavaScriptを有効にすると、4場面を操作できます。</p></div>
 <figcaption>線はAttentionの重みではありません。</figcaption>
</figure>
